<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShopMarx</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <a class="popup-brand" href="dashboard.html" target="_blank" title="Open dashboard">
      <svg class="logo" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect class="logo__tile" width="24" height="24" rx="5"/><path class="logo__mark" d="M8.5 6.5h7v11l-3.5-3-3.5 3z"/></svg>
      <h1 class="popup-header__name"><span class="name-accent">Shop</span>Marx<span class="app-version"></span></h1>
    </a>
    <button id="save" class="button button--primary" type="submit" form="save-form" hidden title="Save this item to ShopMarx (or update it)">Save</button>
  </header>

  <p id="message" class="message muted">Reading this page</p>

  <p id="hint" class="hint" hidden>
    <span class="hint__text">This page doesn't look like a product, but you can still save it.</span>
    <button id="hint-close" class="hint__close" type="button" title="Hide this message" aria-label="Hide this message"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </p>
  <form id="save-form" class="save-form" hidden>

    <div class="field">
      <span class="field__label">Lists</span>
      <div class="input-group list-row">
        <div id="lists" class="list-choice">
          <div class="input list-choice__field">
            <input class="list-choice__search" maxlength="60" autocomplete="off" aria-label="Lists">
            <span class="save-shortcut" aria-hidden="true"><kbd id="save-shortcut-mod" class="key">Ctrl</kbd><kbd class="key"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 10-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg></kbd><span class="save-shortcut__equals">=</span><svg class="save-shortcut__icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg></span>
          </div>
          <div class="list-choice__panel" hidden></div>
        </div>
        <button id="note-toggle" class="button button--ghost icon-button" type="button" title="Add a note" aria-label="Add a note" aria-controls="note-field" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path class="note-toggle__plus" d="M12 7v6"/><path d="M9 10h6"/></svg></button>
      </div>
    </div>
    <label id="note-field" class="field" hidden>
      <span class="field__label">Note</span>
      <textarea id="note" class="input" rows="2" placeholder="Add custom note (optional)"></textarea>
    </label>

    <hr class="divider">

    <div class="preview">
      <div class="preview__media">
        <div class="preview__image">
          <img id="image" alt="" referrerpolicy="no-referrer">
        </div>
        <div id="pager" class="pager">
          <button id="prev-image" class="pager__button" type="button" aria-label="Previous image" title="Previous picture">‹</button>
          <span id="image-index" class="muted"></span>
          <button id="next-image" class="pager__button" type="button" aria-label="Next image" title="Next picture">›</button>
        </div>
      </div>
      <div class="preview__fields">
        <div class="input-group title-row">
          <label class="field">
            <span class="field__label">Title</span>
            <textarea id="title" class="input" rows="3" placeholder="Title" required></textarea>
          </label>
          <button id="title-target" class="button button--ghost icon-button" type="button" title="Show where the product name is on the page" aria-label="Show where the product name is on the page"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h3"/><path d="M19 12h3"/><path d="M12 2v3"/><path d="M12 19v3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="input-group price-row">
          <label class="field">
            <span id="price-label" class="field__label">Price</span>
            <span class="price-field">
              <input id="price" class="input" inputmode="decimal" autocomplete="off" placeholder="Price">
              <span id="price-unit" class="price-field__unit" aria-hidden="true"></span>
            </span>
          </label>
          <button id="price-target" class="button button--ghost icon-button" type="button" title="Show where the price is on the page" aria-label="Show where the price is on the page"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h3"/><path d="M19 12h3"/><path d="M12 2v3"/><path d="M12 19v3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
    </div>

    <p id="status" class="status" role="status"></p>
  </form>

  <script src="extractor.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
